# herdr-dispatch — Herdr plugin manifest (TB-03)
#
# Herdr validates this file, injects the plugin environment, starts the declared
# commands, and records their logs. There is no plugin SDK and no restricted
# command set: the whole Herdr CLI is the plugin API, reached through
# HERDR_BIN_PATH.
#
# Commands are argv arrays and are NOT run through a shell, so there is no
# variable expansion or piping unless a command starts a shell itself.
#
# min_herdr_version is required and Herdr refuses to link when it is missing,
# invalid, or newer than the running binary. 0.9.0 is the floor for
# pane.report_metadata (sidebar tokens) and plugin.link.

id = "herdr-dispatch"
name = "Dispatch Lanes"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Orchestrate coding agents as addressable, observable dispatch lanes"
platforms = ["macos", "linux"]

# Reconcile the pane registry once, after Herdr restores the session and its
# API socket is ready. Not a daemon: it restores state, applies what it can,
# and exits. A failure here must not stop the server, so the command reports
# and returns rather than raising.
[[startup]]
command = ["python3", "bin/dispatch_plugin.py", "startup"]

# Re-publish lane identity into the sidebar. Presentation metadata only.
[[actions]]
id = "project"
title = "Dispatch: refresh lane tokens"
contexts = ["global", "workspace", "tab"]
command = ["python3", "bin/dispatch_plugin.py", "project"]

[[actions]]
id = "status"
title = "Dispatch: status"
contexts = ["global", "workspace", "tab", "pane"]
command = ["python3", "bin/dispatch_plugin.py", "status"]

# Reports which lanes produced a handoff. Never pushes: publication stays a
# human decision, and this only collects.
[[actions]]
id = "harvest"
title = "Dispatch: harvest lane handoffs"
contexts = ["global", "workspace", "pane"]
command = ["python3", "bin/dispatch_plugin.py", "harvest", "--notify"]

# Gate D: Zero-Token Semantic Watchdog sweep (Issue #134).
# Evaluates quiet lanes and automatically extends lease for legitimate heavy computations.
[[actions]]
id = "watchdog"
title = "Dispatch: Gate D semantic watchdog sweep"
contexts = ["global", "workspace"]
command = ["python3", "bin/dispatch_plugin.py", "watchdog", "--sweep"]

# The Agents view projection replaces the session's agent_panel_sort policy
# while it is active, so it stays an explicit action rather than a startup
# side effect.
[[actions]]
id = "agent-view"
title = "Dispatch: show lanes in the Agents panel"
contexts = ["global", "workspace"]
command = ["python3", "bin/dispatch_plugin.py", "view", "--on"]

[[actions]]
id = "agent-view-off"
title = "Dispatch: restore the default Agents panel"
contexts = ["global", "workspace"]
command = ["python3", "bin/dispatch_plugin.py", "view", "--off"]

# NOTE: the three pipeline gates -- `claim` (1 Lane = 1 Worktree = 1 Branch),
# `closeout` (Closeout Lifecycle Gate, Issue #121) and `prompt-check` (prompt
# protocol gate) -- are deliberately NOT declared as actions here.
#
# A manifest `command` is a fixed argv array that Herdr invokes with no runtime
# arguments, so all three exit 2 when launched from the action menu: `claim`
# needs `--lane`, `closeout` needs an evidence bundle, and `prompt-check` needs
# stdin Herdr does not supply. Worse, `plugin action invoke` reports its own
# exit 0 because it only *launches* the command, so a gate that always refuses
# looks healthy in the menu. An entry that cannot work is worse than no entry.
#
# They remain fully functional as CLI pipeline gates, which is their real
# calling convention -- see SKILL.md and the plugin README for exact
# invocations, and `dispatch_plugin.py --help` for the argument surface.

# An Agents status change is the cheapest signal that a lane moved. The command
# re-projects tokens for the lanes we know about; it never writes lifecycle
# state, which Herdr's own herdr:omp integration owns.
[[events]]
on = "pane.agent_status_changed"
command = ["python3", "bin/dispatch_plugin.py", "project"]

# A closed pane usually means a finished or crashed lane; re-publish so the
# sidebar stops advertising a pane that no longer exists.
[[events]]
on = "pane.closed"
command = ["python3", "bin/dispatch_plugin.py", "project"]

# popup is session-modal: it does not change the tiled layout, closes when the
# command exits, and receives all terminal input. Omitted dimensions default to
# half the terminal; smaller requests are clamped by Herdr.
[[panes]]
id = "board"
title = "Dispatch Lanes"
placement = "popup"
width = "80%"
height = 24
command = ["python3", "bin/dispatch_board.py", "--once"]

# Keep the keybindings that already exist in this machine's Herdr config
# (prefix is ctrl+a here; e / o / r / \ / - are taken) untouched: the operator
# binds these explicitly in config.toml rather than having the plugin claim
# keys it does not own.