# Topgrade Configuration - mac-bootstrap Single Source of Truth
# Managed by template/system/topgrade/topgrade.toml -> ~/.config/topgrade.toml

[misc]
assume_yes = true
cleanup = true
notify_end = "on_failure"
show_skipped = false
no_retry = true
# Disable steps that shouldn't run unconditionally or require interactive credentials
disable = [
    "system",       # macOS softwareupdate requires sudo password and potential restart
    "mas",          # Mac App Store requires interactive Apple ID authentication
    "shell",        # Zsh plugin update (zinit) hits raw github and fails behind GFW
    "conda",        # Miniforge/conda is deprecated in favor of uv
    "mamba",        # Miniforge/conda is deprecated in favor of uv
    "colima",       # Colima VM may be offline
    "containers",   # Docker daemon may be offline
    "git_repos",    # Do not indiscriminately git pull local dev repositories
    "vim",          # System vim plugin update fails headless; Neovim is updated separately
    "tmux",         # Tmux is not installed; prevent TPM execution failures
    "pnpm",         # Global pnpm bin is not in PATH; Bun/npm/uv manage global tools
    "pipx"          # All CLI tools migrated to uv tool
]

# Steps that shouldn't block the entire upgrade run if they fail
ignore_failures = [
    "colima",
    "containers",
    "system",
    "gem"
]

[brew]
# Set greedy_cask = false to avoid unexpectedly breaking GUI apps with internal updaters
greedy_cask = false
greedy_auto_updates = false
autoremove = true
[npm]
use_sudo = false

